<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🏛️ Pantheon</title>
  <style>
    :root {
      --bg: #0f1115;
      --panel: #161922;
      --panel-2: #1d2230;
      --text: #e6e9ef;
      --dim: #8a93a6;
      --accent: #6ea8ff;
      --accent-2: #b48cff;
      --success: #57c98c;
      --error: #ff6b6b;
      --border: #2a2f3d;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Helvetica Neue", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
    }
    .sidebar {
      width: 240px;
      background: var(--panel);
      border-right: 1px solid var(--border);
      padding: 20px;
      overflow-y: auto;
    }
    .sidebar h2 {
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--dim);
      margin-top: 24px;
      margin-bottom: 10px;
    }
    .sidebar h1 {
      font-size: 20px;
      margin: 0 0 6px 0;
    }
    .sidebar .subtitle {
      color: var(--dim);
      font-size: 12px;
      margin-bottom: 8px;
    }
    .role-item {
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 8px;
      cursor: pointer;
      transition: all .15s;
    }
    .role-item:hover {
      border-color: var(--accent);
      transform: translateX(2px);
    }
    .role-item.selected {
      border-color: var(--accent);
      background: rgba(110, 168, 255, 0.1);
    }
    .role-item .name {
      font-weight: 600;
      font-size: 14px;
    }
    .role-item .desc {
      font-size: 11px;
      color: var(--dim);
      margin-top: 4px;
    }
    .role-item .model {
      font-size: 10px;
      color: var(--accent-2);
      margin-top: 4px;
      font-family: monospace;
    }
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    .header {
      padding: 14px 24px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--panel);
    }
    .header .mode-pill {
      background: var(--panel-2);
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 12px;
      font-family: monospace;
      color: var(--accent);
      border: 1px solid var(--border);
    }
    .chat {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .message {
      max-width: 80%;
      padding: 14px 18px;
      border-radius: 12px;
      line-height: 1.55;
      white-space: pre-wrap;
      word-wrap: break-word;
    }
    .message.user {
      align-self: flex-end;
      background: var(--accent);
      color: #0f1115;
      border-bottom-right-radius: 2px;
    }
    .message.assistant {
      align-self: flex-start;
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-bottom-left-radius: 2px;
    }
    .message.system {
      align-self: center;
      background: transparent;
      color: var(--dim);
      font-size: 12px;
      font-style: italic;
      padding: 4px 0;
    }
    .message .role-tag {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--accent-2);
      margin-bottom: 6px;
    }
    .input-area {
      padding: 16px 24px;
      border-top: 1px solid var(--border);
      background: var(--panel);
      display: flex;
      gap: 10px;
    }
    .input-area textarea {
      flex: 1;
      background: var(--panel-2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 14px;
      font-family: inherit;
      font-size: 14px;
      resize: none;
      min-height: 50px;
      max-height: 200px;
      outline: none;
    }
    .input-area textarea:focus {
      border-color: var(--accent);
    }
    .input-area button {
      background: var(--accent);
      color: #0f1115;
      border: none;
      border-radius: 8px;
      padding: 0 22px;
      font-weight: 600;
      cursor: pointer;
      font-size: 14px;
      transition: opacity .15s;
    }
    .input-area button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    .input-area button:hover:not(:disabled) {
      opacity: 0.85;
    }
    .steps {
      margin-top: 10px;
      padding-left: 14px;
      border-left: 2px solid var(--accent-2);
    }
    .step {
      font-size: 13px;
      color: var(--dim);
      margin-bottom: 6px;
    }
    .step .role {
      color: var(--accent);
      font-weight: 600;
    }
    .loading-dots::after {
      content: "…";
      animation: dots 1.2s steps(4) infinite;
    }
    @keyframes dots {
      0%, 20% { content: ""; }
      40% { content: "."; }
      60% { content: ".."; }
      80%, 100% { content: "..."; }
    }
    code {
      background: rgba(0,0,0,0.3);
      padding: 2px 5px;
      border-radius: 4px;
      font-size: 13px;
      font-family: "SF Mono", Menlo, monospace;
    }
    pre {
      background: rgba(0,0,0,0.3);
      padding: 10px;
      border-radius: 6px;
      overflow-x: auto;
    }
  </style>
</head>
<body>
  <aside class="sidebar">
    <h1>🏛️ Pantheon</h1>
    <div class="subtitle">Multi-AI-role collaboration</div>

    <h2>Mode</h2>
    <div id="mode-auto" class="role-item selected" data-mode="auto">
      <div class="name">🪄 Auto</div>
      <div class="desc">Hermes picks the right god(s)</div>
    </div>
    <div id="mode-multi" class="role-item" data-mode="multi">
      <div class="name">🧩 Multi-role</div>
      <div class="desc">Force multi-step collaboration</div>
    </div>

    <h2>Gods</h2>
    <div id="roles-list">
      <div class="role-item" data-mode="auto"><div class="dim">Loading…</div></div>
    </div>
  </aside>

  <main class="main">
    <header class="header">
      <div>
        <strong>Chat</strong>
      </div>
      <span id="mode-pill" class="mode-pill">auto</span>
    </header>

    <div id="chat" class="chat">
      <div class="message system">
        👋 Welcome. Pick a mode or god on the left, then type your task below.
      </div>
    </div>

    <form id="form" class="input-area">
      <textarea id="input" placeholder="Ask the Pantheon..." rows="2"></textarea>
      <button id="send" type="submit">Send</button>
    </form>
  </main>

  <script>
    let currentMode = "auto";
    let currentRole = null;

    // Load roles
    fetch("/api/roles").then(r => r.json()).then(data => {
      const list = document.getElementById("roles-list");
      list.innerHTML = "";
      for (const role of (data.roles || [])) {
        const div = document.createElement("div");
        div.className = "role-item";
        div.dataset.mode = `role:${role.name}`;
        div.innerHTML = `
          <div class="name">${roleIcon(role.name)} ${role.name}</div>
          <div class="desc">${escapeHtml(role.description)}</div>
          <div class="model">${escapeHtml(role.model || "")}</div>
        `;
        div.addEventListener("click", () => selectMode(div.dataset.mode, div, role.name));
        list.appendChild(div);
      }
    }).catch(err => {
      document.getElementById("roles-list").innerHTML =
        '<div class="role-item"><div class="desc" style="color:var(--error)">Failed to load roles</div></div>';
    });

    function roleIcon(name) {
      return ({
        hermes: "📨", hephaestus: "🔨", athena: "🦉",
        apollo: "🎵", chronos: "⏰"
      })[name] || "✨";
    }

    function escapeHtml(s) {
      return String(s || "").replace(/[&<>"']/g, c => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      })[c]);
    }

    function selectMode(mode, el, roleName) {
      currentMode = mode;
      currentRole = roleName || null;
      document.querySelectorAll(".role-item").forEach(e => e.classList.remove("selected"));
      el.classList.add("selected");
      document.getElementById("mode-pill").textContent = mode;
    }

    document.getElementById("mode-auto").addEventListener("click", e => selectMode("auto", e.currentTarget));
    document.getElementById("mode-multi").addEventListener("click", e => selectMode("multi", e.currentTarget));

    const chat = document.getElementById("chat");
    const form = document.getElementById("form");
    const input = document.getElementById("input");
    const sendBtn = document.getElementById("send");

    function appendMessage(role, content, opts = {}) {
      const div = document.createElement("div");
      div.className = `message ${role}`;
      if (opts.tag) {
        const t = document.createElement("span");
        t.className = "role-tag";
        t.textContent = opts.tag;
        div.appendChild(t);
      }
      const c = document.createElement("span");
      c.textContent = content;
      div.appendChild(c);
      if (opts.steps && opts.steps.length) {
        const s = document.createElement("div");
        s.className = "steps";
        opts.steps.forEach(step => {
          const sd = document.createElement("div");
          sd.className = "step";
          sd.innerHTML = `<span class="role">${step.role}</span>: ${escapeHtml(step.content.slice(0, 200))}`;
          s.appendChild(sd);
        });
        div.appendChild(s);
      }
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
      return div;
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;

      appendMessage("user", text);
      input.value = "";
      sendBtn.disabled = true;

      const loading = appendMessage("assistant", "Thinking", { tag: currentMode });
      const textNode = loading.querySelector("span:last-child");
      textNode.classList.add("loading-dots");

      try {
        const body = { task: text, mode: currentMode };
        if (currentMode.startsWith("role:")) {
          body.role = currentMode.split(":", 2)[1];
          body.mode = "auto";
        }
        const resp = await fetch("/api/ask", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
        });
        if (!resp.ok) {
          const err = await resp.json().catch(() => ({}));
          throw new Error(err.detail || `HTTP ${resp.status}`);
        }
        const data = await resp.json();
        loading.remove();
        appendMessage("assistant", data.content, { tag: data.mode, steps: data.steps });
      } catch (err) {
        loading.remove();
        appendMessage("assistant", `❌ Error: ${err.message}`, { tag: "error" });
      } finally {
        sendBtn.disabled = false;
        input.focus();
      }
    });

    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        form.dispatchEvent(new Event("submit"));
      }
    });
  </script>
</body>
</html>
