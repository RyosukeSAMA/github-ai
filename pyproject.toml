[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pantheon-ai"
version = "0.2.0"
description = "A multi-AI-role collaboration framework. Each god has a specialty; Hermes orchestrates."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "RyosukeSAMA" }
]
keywords = ["ai", "multi-agent", "llm", "collaboration", "framework"]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "httpx>=0.25.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "openai>=1.0.0",
    "anthropic>=0.18.0",
    "mcp>=1.27,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
]
ollama = [
    # Ollama is optional; install only if you need local models
]

[project.scripts]
pantheon = "pantheon.cli:app"

[project.urls]
Homepage = "https://github.com/RyosukeSAMA/github-ai"
Documentation = "https://github.com/RyosukeSAMA/github-ai/tree/main/docs"
Issues = "https://github.com/RyosukeSAMA/github-ai/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["pantheon*"]

[tool.setuptools.package-data]
pantheon = [
    "web/static/*",
    "web/static/avatars/*",
    "skills/*/SKILL.md",
    "skills/*/pantheon.json",
    "skills/*/agents/*.yaml",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
